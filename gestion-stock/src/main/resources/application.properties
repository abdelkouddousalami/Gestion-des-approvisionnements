# Application
spring.application.name=gestion-stock-tricol
server.port=8080

spring.datasource.url=jdbc:mysql://mysql:3306/gestionstock?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.url=jdbc:mysql://mysql:3306/gestionstock?allowPublicKeyRetrieval=true&useSSL=false
spring.liquibase.user=root
spring.liquibase.password=rootpassword
spring.liquibase.driver-class-name=com.mysql.cj.jdbc.Driver
# Jackson (JSON)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Casablanca

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logging
logging.level.com.tricol.gestionstock=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.liquibase=INFO

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256AlgorithmSecureKey2024
jwt.expiration=86400000
jwt.refresh-expiration=604800000

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/tricol
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/tricol/protocol/openid-connect/certs

keycloak.realm=tricol
keycloak.auth-server-url=http://keycloak:8080
keycloak.client-id=gestion-stock-client
keycloak.client-secret=your-client-secret

app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
```

