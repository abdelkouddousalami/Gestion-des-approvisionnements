# Application
spring.application.name=gestion-stock-tricol
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/gestionstock?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=mypassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Liquibase - DISABLED (using JPA for schema generation)
spring.liquibase.enabled=false
# Jackson (JSON)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Casablanca

# Swagger/OpenAPI - DISABLED (SpringDoc 2.2.0 incompatible with Spring Boot 2.7.18)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.com.tricol.gestionstock=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.liquibase=INFO

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256AlgorithmSecureKey2024
jwt.expiration=86400000
jwt.refresh-expiration=604800000

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/tricol
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/tricol/protocol/openid-connect/certs

keycloak.realm=tricol
keycloak.auth-server-url=http://keycloak:8080
keycloak.client-id=gestion-stock-client
keycloak.client-secret=your-client-secret

app.cors.allowed-origins=http://localhost:80,http://localhost:3000,http://localhost:4200,http://localhost
```

