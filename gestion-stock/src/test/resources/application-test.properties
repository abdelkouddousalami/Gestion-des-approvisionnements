spring.application.name=gestion-stock-tricol-test

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.liquibase.enabled=false

jwt.secret=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256AlgorithmSecureKey2024
jwt.expiration=86400000
jwt.refresh-expiration=604800000

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/tricol
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/tricol/protocol/openid-connect/certs

logging.level.com.tricol.gestionstock=INFO
